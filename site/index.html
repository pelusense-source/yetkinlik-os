function lessons(){let lessonList=seed.lessons.filter(l=>l.week===week);let done=countDone(lessonList);return `<div class="card"><div class="card-head" style="flex-wrap:wrap"><div><h2>İlk 4 hafta: 52 ders ve uygulama</h2><span class="subtle small">Her dersi kendi çıktını üreterek tamamla.</span></div><button class="button sm" data-action="new-task">＋ Kendi çalışma görevim</button></div><div class="week-tabs">${[1,2,3,4].map(n=>`<button class="week-tab ${week===n?'active':''}" data-action="week-lessons" data-week="${n}">${n}. hafta <span class="tiny">(${countDone(seed.lessons.filter(l=>l.week===n))}/${seed.lessons.filter(l=>l.week===n).length})</span></button>`).join('')}</div>${progressLine(pct(done,lessonList.length))}<p class="small subtle">${done} / ${lessonList.length} ders tamamlandı</p>${lessonList.map(l=>{let linked=getResources().filter(r=>r.linkedLessonId===l.id || state.resourceLinks[r.id]===l.id);return `<div class="lesson"><div class="lesson-head"><div class="grow"><span class="pill learn">${e(l.category)}</span> <span class="small subtle">${fmtDate(l.date,{day:'numeric',month:'short',weekday:'short'})} · ${l.time}–${l.endTime} · ${l.minutes} dk</span><h3>${e(l.title)}</h3></div><input class="tick" type="checkbox" data-complete="${attr(l.id)}" ${isDone(l.id)?'checked':''} aria-label="${attr(l.title)} tamamlandı"></div><p class="small"><b>Uygulama:</b> ${e(l.assignment)}</p><div class="deliver"><b>Üretilecek çıktı:</b> ${e(l.deliverable)}</div>${state.notes[l.id]?`<p class="small"><b>Notum:</b> ${e(state.notes[l.id])}</p>`:''}${linked.length?`<div class="small" style="margin:10px 0">🔗 Ek kaynak: ${linked.map(r=>safeUrl(r.url)?`<a href="${attr(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">${e(r.name)}</a>`:e(r.name)).join(', ')}</div>`:''}<div class="list-inline" style="margin-top:12px">${safeUrl(l.url)?`<a class="button sm" target="_blank" rel="noopener noreferrer" href="${attr(safeUrl(l.url))}">Eğitimi aç ↗</a>`:''}<button class="button sm" data-action="note" data-id="${attr(l.id)}">✎ Ders notu</button><button class="button sm" data-action="new-resource" data-lesson="${attr(l.id)}">＋ Kaynak bağla</button></div></div>`}).join('')}</div>`}

conbtn" data-action="delete-resource" data-id="${attr(r.id)}" title="Kaynağı sil">✕</button></div></article>`).join('')}</div><div id="resource-empty" class="card empty" style="display:none"><div class="em">⌕</div><b>Kaynak bulunamadı</b><p>Filtreyi değiştir veya kendine yeni bir kaynak ekle.</p><button class="button sm primary" data-action="new-resource">＋ Kaynak ekle</button></div>`}

function roadmap(){return `<div class="notice" style="margin-bottom:17px">Her ayın beklenen çıktısını kendine göre değiştirebilirsin. Güncellemek için ilgili ayda “Hedefi düzenle” düğmesini kullan.</div><div class="month-grid">${seed.months.map((base,i)=>{let m={...base,...state.monthEdits[base.id]};return `<div class="card month"><div class="card-head" style="margin-bottom:3px"><div class="month-no">AY ${String(i+1).padStart(2,'0')}</div><input class="tick" type="checkbox" data-month-done="${attr(m.id)}" ${state.monthDone[m.id]?'checked':''} aria-label="${attr(m.month)} hedefi tamamlandı"></div><h3>${e(m.month)}</h3><p><b>Odak:</b> ${e(m.focus)}</p><p><b>Kaynaklar:</b> ${e(m.source)}</p><p><b>Yöntem:</b> ${e(m.method)}</p><div class="month-out"><b>Ay sonunda:</b> ${e(m.outcome)}</div>${m.personalNote?`<p><b>Kişisel not:</b> ${e(m.personalNote)}</p>`:''}<button class="button sm" style="margin-top:14px" data-action="edit-month" data-id="${attr(m.id)}">✎ Hedefi düzenle</button></div>`}).join('')}</div>`}

const newsCats=['Tümü','Customer Success ve CX','SaaS ve Growth','E-ticaret ve CRM','Liderlik ve Davranış','Yapay Zekâ','Eğitim ve Podcast'];
function newsSources(){return [...newsSeed.sources.filter(s=>!state.newsHiddenSources.includes(s.id)).map(s=>({...s,...(state.newsSourceOverrides[s.id]||{}),custom:false})),...state.newsCustomSources.map(s=>({...s,custom:true}))]}
function newsArticles(){
  const live = liveData.articles.length ? liveData.articles : newsSeed.articles;
  return [...live.filter(a=>!state.newsRemovedArticles.includes(a.id)),...state.newsCustomArticles];
}
function isoIstanbul(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function liveStatus(){
  if(location.protocol==='file:')return 'Bu dosya çevrimdışı açılmış. Günlük otomatik tarama için uygulamayı GitHub Pages üzerinde yayımla.';
  if(liveData.status==='loading')return 'Yayın akışı kontrol ediliyor…';
  if(liveData.status==='error')return 'Güncel akış alınamadı: '+liveData.message+' · Son kaydedilmiş örnekler gösteriliyor.';
  if(!liveData.generatedAt)return 'Otomatik tarama henüz başlamadı. GitHub Actions üzerinden ilk çalıştırmayı yap.';
  const time=new Date(liveData.generatedAt).toLocaleString('tr-TR',{timeZone:'Europe/Istanbul',day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'});
  return 'Son tarama: '+time+' · '+liveData.articles.length+' güncel/arşiv başlık · '+liveData.successCount+' kaynak erişilebilir · '+liveData.unavailableCount+' kaynağa erişilemedi. Başlıklar ve yayıncı özetleri otomatik, Türkçeye çevrilmiş/AI ile özetlenmiş değildir.';
}
async function loadLiveNews(manual=false){
  if(location.protocol==='file:'){liveData.status='offline';if(view==='newsletter')render();return}
  if(manual){liveData.status='loading';if(view==='newsletter')render()}
  try{
    const r=await fetch('./data/news.json?fresh='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw Error('HTTP '+r.status);
    const payload=await r.json();
    if(!Array.isArray(payload.articles))throw Error('Geçersiz veri biçimi');
    liveData={status:'ok',articles:payload.articles.filter(a=>a&&typeof a.title==='string'&&typeof a.id==='string'&&typeof a.date==='string'),sources:Array.isArray(payload.sources)?payload.sources:[],generatedAt:payload.generatedAt||null,successCount:payload.successCount||0,unavailableCount:payload.unavailableCount||0,dailyDigest:payload.dailyDigest||null,digestHistory:Array.isArray(payload.digestHistory)?payload.digestHistory:[],message:''};
    if(manual)toast('Bülten verisi kontrol edildi.');
  }catch(err){liveData.status='error';liveData.message=String(err?.message||err).slice(0,150);if(manual)toast('Güncelleme alınamadı',true)}
  if(view==='newsletter')render();
}
function monitoredSourcesConfig(){
 const defaultFeeds={ns05:'https://www.saastr.com/feed/',ns09:'https://blog.hubspot.com/marketing/rss.xml',ns16:'https://openai.com/news/rss.xml',ns21:'https://www.saastr.com/feed/'};
 const defaults={ns10:'"customer experience" "retention"',ns15:'"Simon Sinek" leadership',ns19:'site:coursera.org/articles',ns20:'site:linkedin.com/learning',ns21:'"SaaStr Podcast"',ns22:'"Gainsight GameChanger Podcast"',ns03:'Totango Odie customer success'};
 return {sources:newsSources().map(s=>({id:s.id,name:s.name,category:s.category,type:s.type,url:s.url||'',priority:s.priority||'Orta',mode:s.id==='ns14'?'archive':'auto',feed:s.feed||defaultFeeds[s.id]||'',...(s.query||defaults[s.id]?{query:s.query||defaults[s.id]}:{})}))};
}
function newsTimeMatches(a){
 if(newsTimeFilter==='all')return true;
 const day=isoIstanbul();
 if(newsTimeFilter==='today')return a.date===day;
 const ref=new Date(day+'T12:00:00Z');ref.setUTCDate(ref.getUTCDate()-6);
 return a.date>=ref.toISOString().slice(0,10)&&a.date<=day;
}

function findNewsSource(id){return newsSources().find(s=>s.id===id)||newsSeed.sources.find(s=>s.id===id)}
function selectedNews(){return newsArticles().filter(a=>!state.newsExcluded[a.id]).sort((a,b)=>b.date.localeCompare(a.date))}
function digestMarkdown(){let ar=selectedNews(),out=['# Yetkinlik OS — Kişisel Okuma Bülteni','',`Oluşturma: ${new Date().toLocaleDateString('tr-TR')}`,'',`Güncel durum: ${liveStatus()}`,''];for(const cat of newsCats.slice(1)){let group=ar.filter(a=>findNewsSource(a.sourceId)?.category===cat);if(!group.length)continue;out.push('## '+cat,'');for(const a of group){let src=findNewsSource(a.sourceId);out.push('### '+a.title,`Kaynak: ${src?.name||'Kişisel kaynak'} | Yayın: ${a.date} | ${a.priority||'Okuma listesi'}`,'',a.summary||'Özet eklenmedi.','',`**Uygulama:** ${a.action||'Okuyup öğrendiklerini not et.'}`,'',a.url||'','');}}if(!ar.length)out.push('Bülten için makale seçmedin.');return out.join('\n')}
function newsSourceCard(s){
 const h=liveData.sources.find(x=>x.id===s.id);
 const details = !h ? (s.custom?'Yalnızca bu cihazda · Tarama için kaynak listesini dışa aktar':'İlk günlük tarama bekleniyor')
   : h.status==='ok' ? `✓ Tarandı · ${h.count} yakın tarihli yayın · ${h.provider}`
   : h.status==='archive' ? 'Arşiv kaynağı · Otomatik yeni yayın beklenmez'
   : '⚠ Yakın tarihli yayın alınamadı';
 return `<div class="card news-source-card"><div class="news-meta"><span class="pill ${s.custom?'custom':'learn'}">${s.custom?'Ben ekledim':e(s.type||'Kaynak')}</span><span class="small subtle">${e(s.priority||'Orta')} öncelik</span></div><h3>${e(s.name)}</h3><p class="small subtle">${e(s.purpose||'')}</p>${s.status&&s.status!=='Yayın'?`<p class="small subtle">ℹ ${e(s.status)}</p>`:''}<div class="news-track-status small">${e(details)}</div><div class="news-foot">${safeUrl(s.url)?`<a class="button sm" target="_blank" rel="noopener noreferrer" href="${attr(safeUrl(s.url))}">Siteye git ↗</a>`:'<span class="small subtle">Konu başlığı / dış URL yok</span>'}<span class="grow"></span><button class="button sm" data-action="edit-news-source" data-id="${attr(s.id)}">Düzenle</button><button class="iconbtn" data-action="delete-news-source" data-id="${attr(s.id)}" title="Kaynağı kaldır">✕</button></div></div>`
}
function newsArticleCard(a){let src=findNewsSource(a.sourceId),read=!!state.newsRead[a.id],saved=!!state.newsSaved[a.id],excluded=!!state.newsExcluded[a.id];return `<article class="card news-article ${excluded?'news-muted':''}"><div class="news-meta"><span class="pill learn">${e(src?.category||'Diğer')}</span><span class="small subtle">${e(src?.name||'Kişisel kaynak')} · ${e(a.date)}</span></div><h3>${e(a.title)}</h3>${a.originalTitle&&a.originalTitle!==a.title?`<p class="tiny subtle">${e(a.originalTitle)}</p>`:''}<p>${e(a.summary||'Özet henüz eklenmedi.')}</p><div class="news-action-note"><b>İşine uygulama fikri:</b> ${e(a.action||'Okuduklarından bir uygulama notu çıkar.')}</div><div class="news-foot"><label class="small"><input type="checkbox" data-news-selected="${attr(a.id)}" ${excluded?'':'checked'}> Bültene ekle</label><button class="button sm ${read?'news-pressed':''}" data-action="news-read" data-id="${attr(a.id)}">${read?'✓ Okundu':'Okundu işaretle'}</button><button class="button sm ${saved?'news-pressed':''}" data-action="news-save" data-id="${attr(a.id)}">${saved?'★ Kaydedildi':'☆ Daha sonra oku'}</button>${safeUrl(a.url)?`<a class="button sm primary" href="${attr(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">Makaleyi aç ↗</a>`:''}${a.id.startsWith('own-news-')?`<button class="button sm" data-action="edit-news-article" data-id="${attr(a.id)}">Düzenle</button><button class="iconbtn" data-action="delete-news-article" data-id="${attr(a.id)}">✕</button>`:''}</div></article>`}

function dailyBriefing(){
  const d=liveData.dailyDigest;
  if(!d)return `<div class="brief-empty"><h2>Günlük özet henüz hazırlanmadı</h2><p>İlk taramada başlık ve kaynak açıklamalarına dayalı otomatik özet oluşturulacak. Güncel akış için yukarıdaki “Güncel akışı kontrol et” seçeneğini kullan.</p><button class="button" data-action="news-tab" data-id="digest">Bülten makalelerine geç</button></div>`;
  const dated=d.date===isoIstanbul()?'Bugün':'Son hazırlanan gün: '+d.date;
  const isAI=d.mode==='ai';
  const span=d.scope==='last24h'?'Son 24 saat':'Son 7 gün (son 24 saatte yeni başlık yok)';
  const metadata=`<div class="brief-meta"><span>${e(dated)}</span><span>${e(span)}</span><span>${Number(d.selectedCount)||0} seçilmiş içerik</span><span>${isAI?'Yapay zekâ destekli sınırlı özet':'Başlık / yayıncı açıklaması özeti'}</span></div>`;
  const sections=(d.sections||[]).map(x=>`<section class="brief-section"><h3>${e(x.category)}</h3><p>${e(x.overview)}</p></section>`).join('');
  const cards=(d.cards||[]).map((c,i)=>{
    const a=newsArticles().find(x=>x.id===c.id);
    const link=a&&safeUrl(a.url)?`<a class="button sm primary" href="${attr(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">Asıl makaleyi oku ↗</a>`:'';
    const saved=state.newsSaved[c.id];
    const read=state.newsRead[c.id];
    return `<article class="brief-card"><div class="news-meta"><span class="pill learn">${e(c.category||'Sektör')}</span><span class="small subtle">${e(c.source||'')} · ${e(a?.date||d.date)}</span></div><div class="brief-label">${i+1}. Öne çıkan</div><h3>${e(c.title||a?.title||'Makale')}</h3><p>${e(c.summary||'Makale özeti bulunmuyor.')}</p><p class="brief-detail"><b>Neden takip etmeli?</b> ${e(c.relevance||'Takip ettiğin konuyla ilişkili.')}</p>${c.basis==='title_only'?'<p class="brief-detail">ℹ Yalnızca başlık verisi mevcut.</p>':''}<div class="brief-card-links">${link}<button class="button sm ${saved?'news-pressed':''}" data-action="news-save" data-id="${attr(c.id)}">${saved?'★ Kaydedildi':'☆ Sonra oku'}</button><button class="button sm ${read?'news-pressed':''}" data-action="news-read" data-id="${attr(c.id)}">${read?'✓ Okundu':'Okundu'}</button></div></article>`;
  }).join('');
  return `<div class="daily-brief"><section class="brief-hero"><div class="brief-label">3–5 DAKİKALIK SEKTÖR BRİFİNGİ</div><h2>${e(d.headline||'Günün özeti')}</h2><p>${e(d.intro||'')}</p>${metadata}</section><div class="notice"><b>Özetin sınırı:</b> ${e(d.note||'Özetler eldeki kaynak verilerine dayanır.')} Yeni yayınların tümünü içermeyebilir; ayrıntı için özgün makaleyi aç.</div>${sections?`<div class="news-section-head"><div><h2>Gündemdeki alanlar</h2><p class="small subtle">Gelişmeleri kategorilere göre ön izle.</p></div></div><div class="brief-section-grid">${sections}</div>`:''}<div class="news-section-head"><div><h2>Önce bunları oku <span class="subtle">(${(d.cards||[]).length})</span></h2><p class="small subtle">Kısa özet → önemli nokta → özgün makale</p></div><button class="button" data-action="brief-export">↓ Günün özetini indir</button></div><div class="brief-cards">${cards||'<div class="brief-empty">Bugün için yeni içerik bulunamadı. Güncel makaleleri Bülten & Makaleler bölümünden inceleyebilirsin.</div>'}</div><div class="hero-actions"><button class="button primary" data-action="news-tab" data-id="digest">Tüm makaleleri incele →</button></div></div>`;
}
function briefingMarkdown(){const d=liveData.dailyDigest;if(!d)return 'Günlük özet henüz hazır değil.';const lines=[`# Yetkinlik OS — ${d.date} Günün Özeti`,'',d.headline||'', '', d.intro||'', '', `> ${d.note||''}`,'']; for(const c of d.cards||[]){const a=newsArticles().find(a=>a.id===c.id);lines.push(`## ${c.title||''}`,`Kaynak: ${c.source||''} | Kategori: ${c.category||''}`,'',c.summary||'', '',`Neden önemli: ${c.relevance||''}`,'',a?.url||'','');}return lines.join('\n')}

primary':''}" data-action="news-tab" data-id="sources">Takip Kaynaklarım (${n})</button></div><div class="news-tools"><input id="news-search" value="${attr(newsText)}" placeholder="Makale veya kaynak ara..." type="search" aria-label="Bülten ara"><select id="news-category" aria-label="Kategori">${options(newsCats,newsCategory)}</select><select id="news-time" aria-label="Tarih filtresi"><option value="all" ${newsTimeFilter==='all'?'selected':''}>Tüm tarihler</option><option value="7d" ${newsTimeFilter==='7d'?'selected':''}>Son 7 gün</option><option value="today" ${newsTimeFilter==='today'?'selected':''}>Bugün</option></select></div></div>${newsTab==='overview'?dailyBriefing():newsTab==='digest'?`<div class="news-section-head"><div><h2>Seçilmiş makaleler <span class="subtle">(${ar.length})</span></h2><p class="small subtle">Bültenine alınacak içerikleri seçebilir, sonradan düzenleyeceğin yeni makaleler ekleyebilirsin.</p></div><button class="button primary" data-action="new-news-article">＋ Makale ekle</button></div><div class="news-articles">${ar.map(newsArticleCard).join('')||'<div class="card empty">Bu filtrede makale bulunamadı.</div>'}</div>`:`<div class="news-section-head"><div><h2>Kaynak kataloğun <span class="subtle">(${src.length})</span></h2><p class="small subtle">Gönderdiğin 22 isim hazır. Dilediğini düzenle, kaldır veya yeni site ekle. Yeni eklenen kaynakların otomatik taranması için “Otomatik tarama listemi indir” ile aldığın sources.json dosyasını GitHub deponun config klasörüne yükle.</p></div><div class="news-source-actions"><button class="button" data-action="export-monitor-sources">↓ Otomatik tarama listemi indir</button><button class="button primary" data-action="new-news-source">＋ Kaynak ekle</button></div></div><div class="news-sources">${src.map(newsSourceCard).join('')||'<div class="card empty">Bu filtrede kaynak bulunamadı.</div>'}</div>`}`}
function newsSourceModal(id=''){let s=id?findNewsSource(id):null;modal(`<div class="modal-head"><div><h2>${s?'Bülten kaynağını düzenle':'Yeni bülten kaynağı ekle'}</h2><p>Takip edeceğin siteyi, yazarı veya podcast'i kaydet.</p></div><button class="iconbtn" data-action="close-modal">✕</button></div><form id="news-source-form" data-id="${attr(id)}"><div class="fields-grid"><div class="inline-field full"><label>Kaynak adı *</label><input name="name" required maxlength="160" value="${attr(s?.name||'')}" placeholder="Örn. Search Engine Journal"></div><div class="inline-field"><label>Kategori</label><select name="category">${options(newsCats.slice(1),s?.category||newsCats[1])}</select></div><div class="inline-field"><label>Tür</label><select name="type">${options(['Blog','Podcast','Yazar','Yayın','Eğitim','Araştırma / Haber','Konu','Diğer'],s?.type||'Blog')}</select></div><div class="inline-field full"><label>URL</label><input name="url" type="url" placeholder="https://..." value="${attr(s?.url||'')}"></div><div class="inline-field full"><label>RSS / Atom adresi (varsa)</label><input type="url" name="feed" value="${attr(s?.feed||'')}" placeholder="https://site.com/feed.xml"></div><div class="inline-field full"><label>Alternatif haber arama sorgusu (isteğe bağlı)</label><input name="query" maxlength="250" value="${attr(s?.query||'')}" placeholder="site:ornek.com/blog"></div><div class="inline-field"><label>Öncelik</label><select name="priority">${options(['Yüksek','Orta','Düşük'],s?.priority||'Orta')}</select></div><div class="inline-field"><label>Takip notu</label><input name="status" maxlength="100" value="${attr(s?.status||'Yayın')}"></div><div class="inline-field full"><label>Hangi konuda takip ediyorsun?</label><textarea name="purpose" maxlength="1000">${e(s?.purpose||'')}</textarea></div></div><div class="modal-foot"><button type="button" class="button" data-action="close-modal">Vazgeç</button><button type="submit" class="button primary">Kaydet</button></div></form>` ba gönderilmez. Tarayıcı verilerini silersen kayıtların silinebilir; yedek almanı öneririz. Eğitim bağlantıları için internet gerekir.</p>${!storageOK?'<div class="notice">Bu tarayıcı kayıtları saklayamadı. Mutlaka JSON yedeği indir.</div>':''}</div></div></div>`}

function taskModal(id=''){let t=id?state.customTasks.find(t=>t.id===id):null;modal(`<div class="modal-head"><div><h2>${t?'Görevi düzenle':'Kendi çalışma görevini ekle'}</h2><p>Kendi eğitim kaynaklarından veya hedeflerinden yeni görev oluştur.</p></div><button class="iconbtn" data-action="close-modal">✕</button></div><form id="task-form" data-id="${attr(id)}"><div class="fields-grid"><div class="inline-field full"><label>Görev / ders adı *</label><input name="title" maxlength="170" required value="${attr(t?.title||'')}" placeholder="Örn. SQL JOIN soruları çöz"></div><div class="inline-field"><label>Tarih *</label><input name="date" type="date" min="2026-11-02" value="${attr(t?.date||selectedDate)}" required></div><div class="inline-field"><label>Yetkinlik</label><select name="category">${options(cats,t?.category||'Diğer')}</select></div><div class="inline-field"><label>Başlangıç</label><input name="time" type="time" value="${attr(t?.time||'20:00')}" required></div><div class="inline-field"><label>Bitiş</label><input name="endTime" type="time" value="${attr(t?.endTime||'20:45')}" required></div><div class="inline-field full"><label>Kaynak bağla (isteğe bağlı)</label><select name="resourceId">${resourceSelect(t?.resourceId||'')}</select></div><div class="inline-field full"><label>Görev açıklaması</label><textarea name="description" maxlength="1500">${e(t?.description||'')}</textarea></div></div><div class="modal-foot"><button type="button" class="button" data-action="close-modal">Vazgeç</button><button class="button primary" type="submit">Kaydet</button></div></form>`)}
function noteModal(id){let t=allTasks().find(t=>t.id===id);if(!t)return;modal(`<div class="modal-head"><div><h2>Ders / görev notum</h2><p>${e(t.title)}</p></div><button class="iconbtn" data-action="close-modal">✕</button></div><form id="note-form" data-id="${attr(id)}"><div class="inline-field"><label>Ne öğrendin? Ne yapacaksın?</label><textarea name="note" maxlength="5000" style="min-height:175px" placeholder="Kısa öğrenme özeti, çözülmesi gereken soru veya gelişim notu">${e(state.notes[id]||'')}</textarea></div><div class="modal-foot"><button type="button" class="button" data-action="close-modal">Vazgeç</button><button class="button primary" type="submit">Notu kaydet</button></div></form>`)}
function monthModal(id){let src=seed.months.find(m=>m.id===id),m={...src,...state.monthEdits[id]};if(!src)return;modal(`<div class="modal-head"><div><h2>${e(m.month)} hedefin</h2><p>Bu ayın odağını ve beklenen çıktıyı kendine göre düzenle.</p></div><button class="iconbtn" data-action="close-modal">✕</button></div><form id="month-form" data-id="${attr(id)}"><div class="fields-grid"><div class="inline-field full"><label>Öğrenme odağı</label><input name="focus" maxlength="300" value="${attr(m.focus)}"></div><div class="inline-field full"><label>Kaynaklar</label><textarea name="source">${e(m.source)}</textarea></div><div class="inline-field full"><label>Çalışma yöntemi</label><textarea name="method">${e(m.method)}</textarea></div><div class="inline-field full"><label>Ay sonu hedefi</label><textarea name="outcome">${e(m.outcome)}</textarea></div><div class="inline-field full"><label>Özel notların</label><textarea name="personalNote">${e(m.personalNote||'')}</textarea></div></div><div class="modal-foot"><button type="button" class="button" data-action="close-modal">Vazgeç</button><button type="submit" class="button primary">Hedefi kaydet</button></div></form>`)}

function importBackup(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(obj.app!=='yetkinlik-os'||!obj.state||!Array.isArray(obj.state.customResources)||!Array.isArray(obj.state.customTasks))throw new Error('Bu dosya Yetkinlik OS yedeği değil');if(!confirm('Mevcut yerel verilerin seçilen yedekle değiştirilecek. Devam edilsin mi?'))return;state={...structuredClone(DEFAULT),...obj.state};persist();render();toast('Yedek başarıyla yüklendi')}catch(err){toast('Yedek yüklenemedi: '+err.message,true)}};reader.readAsText(file)}
// Event delegation: all navigation and editing controls work after each render.
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;switch(a){case'news-tab':newsTab=id;render();break;case'brief-export':download(new Blob([briefingMarkdown()],{type:'text/markdown;charset=utf-8'}),'YetkinlikOS_Gunun_Ozeti_'+(liveData.dailyDigest?.date||'bugun')+'.md');toast('Günün özeti indirildi');break;case'news-refresh':loadLiveNews(true);break;case'export-monitor-sources':download(new Blob([JSON.stringify(monitoredSourcesConfig(),null,2)],{type:'application/json;charset=utf-8'}),'sources.json');toast('Taranacak kaynak listen indirildi. GitHub config/sources.json içine yükle.');break;case'new-news-source':newsSourceModal();break;case'edit-news-source':newsSourceModal(id);break;case'delete-news-source':{let s=findNewsSource(id);if(!s||!confirm('Kaynak kaldırılsın: '+s.name+'?'))break;if(s.custom)state.newsCustomSources=state.newsCustomSources.filter(x=>x.id!==id);else state.newsHiddenSources=[...new Set([...state.newsHiddenSources,id])];persist();render();toast('Kaynak kaldırıldı');break}case'new-news-article':newsArticleModal();break;case'edit-news-article':newsArticleModal(id);break;case'delete-news-article':if(confirm('Makale silinsin mi?')){state.newsCustomArticles=state.newsCustomArticles.filter(x=>x.id!==id);persist();render()}break;case'news-read':state.newsRead[id]=!state.newsRead[id];persist();render();break;case'news-save':state.newsSaved[id]=!state.newsSaved[id];persist();render();break;case'news-export':download(new Blob([digestMarkdown()],{type:'text/markdown;charset=utf-8'}),'yetkinlik-os-bulten.md');toast('Bülten Markdown olarak indirildi');break;case'news-copy':if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(digestMarkdown()).then(()=>toast('Bülten kopyalandı')).catch(()=>toast('Kopyalanamadı; Markdown indir seçeneğini kullan',true));else toast('Tarayıcı kopyalamayı engelledi; Markdown dosyası indir',true);break;case'nav':view=b.dataset.to;render();window.scrollTo(0,0);break;case'go-resources':view='resources';render();break;case'new-resource':resourceModal('',b.dataset.lesson||'');break;case'edit-resource':resourceModal(id);break;case'delete-resource':{let r=findResource(id);if(!r||!confirm('“'+r.name+'” kaynağını kaldırmak istiyor musun?'))break;if(r.custom)state.customResources=state.customResources.filter(x=>x.id!==id);else state.hiddenResources=[...new Set([...state.hiddenResources,id])];delete state.resourceLinks[id];persist();render();toast('Kaynak kaldırıldı');break}case'restore-resource':state.hiddenResources=state.hiddenResources.filter(x=>x!==id);persist();render();toast('Kaynak geri getirildi');break;case'new-task':taskModal();break;case'edit-task':taskModal(id);break;case'delete-task':{let t=state.customTasks.find(x=>x.id===id);if(!t||!confirm('Görev silinsin mi?'))break;state.customTasks=state.customTasks.filter(x=>x.id!==id);delete state.completed[id];persist();render();break}case'note':noteModal(id);break;case'edit-month':monthModal(id);break;case'date':selectedDate=b.dataset.date;week=weekNo(selectedDate);render();break;case'shift-date':selectedDate=plusDays(selectedDate,Number(b.dataset.step));if(selectedDate<'2026-11-02')selectedDate='2026-11-02';if(selectedDate>'2026-11-29')selectedDate='2026-11-29';week=weekNo(selectedDate);render();break;case'week-date':selectedDate=weekBounds(Number(b.dataset.week))[0];week=weekNo(selectedDate);render();break;case'week-lessons':week=Number(b.dataset.week);render();break;case'close-modal':modalClose();break;case'backdrop':if(ev.target===b)modalClose();break;case'export':jsonExport();break;case'csv':csvExport();break;case'import':$('#backup-input').click();break;case'reset':if(confirm('TÜM görev tamamlama, özel kaynak, not ve hedef verilerini sıfırlamak istediğine emin misin? Bu işlem geri alınamaz.')){state=structuredClone(DEFAULT);persist();render();toast('Veriler sıfırlandı')}break}});
